name: Build and Distribute IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Prepare and upload IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare IPA
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(splitfile*)
          if (( ${#parts[@]} > 0 )); then
            echo "发现 ${#parts[@]} 个分片，开始合并。"
            cat "${parts[@]}" > "$RUNNER_TEMP/ipa_bundle.zip"
            unzip -tq "$RUNNER_TEMP/ipa_bundle.zip"
            mkdir -p "$RUNNER_TEMP/ipa_unpacked"
            unzip -oq "$RUNNER_TEMP/ipa_bundle.zip" -d "$RUNNER_TEMP/ipa_unpacked"
            unpacked_ipas=()
            while IFS= read -r -d '' file; do
              unpacked_ipas+=("$file")
            done < <(find "$RUNNER_TEMP/ipa_unpacked" -type f -name '*.ipa' -print0)
            if (( ${#unpacked_ipas[@]} != 1 )); then
              echo "错误：分片归档中应恰好包含一个 IPA，实际为 ${#unpacked_ipas[@]} 个。"
              exit 1
            fi
            cp "${unpacked_ipas[0]}" "$RUNNER_TEMP/Runner.ipa"
          else
            echo "未发现分片，查找仓库中的 IPA。"
            ipas=()
            while IFS= read -r -d '' file; do
              ipas+=("$file")
            done < <(find . -maxdepth 1 -type f -name '*.ipa' -print0)
            if (( ${#ipas[@]} != 1 )); then
              echo "错误：仓库根目录中应恰好包含一个 IPA，实际为 ${#ipas[@]} 个。"
              exit 1
            fi
            cp "${ipas[0]}" "$RUNNER_TEMP/Runner.ipa"
          fi
          unzip -tq "$RUNNER_TEMP/Runner.ipa"
          ls -lh "$RUNNER_TEMP/Runner.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/Runner.ipa" >> "$GITHUB_ENV"

      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA using official xcrun altool
        shell: bash
        env:
          APPLE_USERNAME: 'huang11huang223@163.com'
          APPLE_PASSWORD: 'ymqv-rqap-zncj-bkqk'
        run: |
          set -euo pipefail
          if [[ "$APPLE_USERNAME" == 'YOUR_APPLE_ID_EMAIL' || "$APPLE_PASSWORD" == 'REPLACE_WITH_NEW_APP_SPECIFIC_PASSWORD' ]]; then
            echo '错误：请在 YAML env 中填写 Apple ID 邮箱和新生成的 App 专用密码。'
            exit 1
          fi
          xcodebuild -version
          xcrun --find altool
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --username "$APPLE_USERNAME" \
            --password '@env:APPLE_PASSWORD' \
            --verbose



